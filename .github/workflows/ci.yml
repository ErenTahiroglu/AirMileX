name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Checks resolved lockfile versions against known advisories
      - run: bun audit --audit-level=moderate
      - run: bunx vitest run
      - run: bun run build
